media:
  input: assets/images
  output: /assets/images

content:
  - name: posts
    label: Исследования (Статьи)
    type: collection
    path: _posts
    filename: "{year}-{month}-{day}-{primary}.md"
    fields:
      - name: layout
        label: Шаблон
        type: string
        default: post
        hidden: true
      - name: title
        label: Заголовок статьи
        type: string
        required: true
      - name: date
        label: Дата публикации
        type: date
        required: true
      - name: category
        label: Кафедра
        type: select
        options:
          values:
            - Кафедра визуальных кодов
            - Лаборатория фольклора и мифа
            - Архив архетипов
      - name: image
        label: Обложка статьи
        type: image
      - name: excerpt
        label: Короткий анонс (лид)
        type: text
      - name: tags
        label: Теги (через Enter)
        type: string
        list: true
      - name: body
        label: Текст исследования
        type: rich-text
        
