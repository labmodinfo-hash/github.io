- title: Ваби-саби
  japanese: 侘寂 — «скромная простота и патина времени»
  category: Эстетика и философия
  description: Эстетическое мировоззрение, находящее красоту в несовершенстве, асимметрии и следах естественного старения вещей. В аниме определяет визуальный стиль заброшенных храмов, старых деревянных домов и эстетику спокойного уединения («Мастер муси»).

- title: Цундэрэ
  japanese: ツンデレ — от «цун-цун» (колючий) и «дэрэ-дэрэ» (нежный)
  category: Архетипы и тропы
  description: Устойчивый архетип персонажа, скрывающего искреннюю привязанность и уязвимость за маской враждебности и высокомерия. В визуальной семиотике аниме считывается по характерному дизайну (прическа с двумя хвостиками, прищур глаз) и резкой смене интонаций.

- title: Ма
  japanese: 間 — «промежуток, пауза, пустое пространство»
  category: Эстетика и философия
  description: Концепция осмысленной пустоты и паузы в японском искусстве, где тишина несет не меньше смысла, чем действие. В режиссуре аниме приемом «ма» называют длинные статичные кадры природы или молчаливые поездки в поезде (характерно для работ Хаяо Миядзаки).

- title: Югэн
  japanese: 幽玄 — «сокровенная глубина, тайная красота»
  category: Эстетика и философия
  description: Эстетическая категория, обозначающая неуловимую, скрытую от глаз тайну мироздания, на которую можно лишь намекнуть. В анимации выражается через туманные горные пейзажи, недосказанность в финале и мистическую атмосферу («Мастер муси», «Ангельское яйцо»).

- title: Кицунэ
  japanese: 狐 — «лисица-оборотень»
  category: Фольклор и мифология
  description: Мифологическое существо японского фольклора, обладающее высоким интеллектом, магией иллюзий и способностью принимать облик человека. В синтоизме белые лисицы считаются посланниками божества плодородия Инари («Очень приятно, Бог», «Наруто»).

- title: Тэнгу
  japanese: 天狗 — «небесная собака»
  category: Фольклор и мифология
  description: Горный дух или лесной демон из японских легенд, изображаемый с красным лицом, длинным носом, крыльями и веером из перьев. В аниме тэнгу часто выступают как строгие наставники боевых искусств или хранители горных святилищ («Клинок, рассекающий демонов»).

- title: Они
  japanese: 鬼 — «демон, огр»
  category: Фольклор и мифология
  description: Крупные клыкастые и рогатые демоны-людоеды в тигровых набедренных повязках с железной палицей канабо. В современной поп-культуре образ «они» трансформировался от абсолютного зла до трагических или даже комедийных персонажей («Несносные пришельцы», «Re:Zero»).

- title: Синигами
  japanese: 死神 — «бог смерти»
  category: Фольклор и мифология
  description: Персонификация смерти в японской культуре, возникшая на стыке буддийских представлений и западного образа Жнеца. В аниме синигами часто представлены как бюрократы загробного мира или проводники душ («Тетрадь смерти», «Блич», «Темный дворецкий»).

- title: Кудэрэ
  japanese: クーデレ — от англ. «cool» (холодный) и «дэрэ» (нежный)
  category: Архетипы и тропы
  description: Архетип персонажа, сохраняющего ледяное спокойствие, отстраненность и полное отсутствие эмоций на лице даже в критических ситуациях. Символом этого типажа стала Рей Аянами из «Евангелиона», породившая целую волну похожих героинь.

- title: Яндэрэ
  japanese: 病んでれ — от «яндэру» (быть нездоровым) и «дэрэ» (влюбленный)
  category: Архетипы и тропы
  description: Архетип персонажа, чья искренняя и нежная влюбленность перерастает в болезненную одержимость, склонность к гиперконтролю и насилию ради объекта чувств. Визуально маркируется «пустыми» расфокусированными глазами и резким контрастом милой улыбки с угрожающей аурой.

- title: Тиби (Чиби)
  japanese: 縮み / ちび — «маленький, коротышка»
  category: Визуальные коды (Манпу)
  description: Стилистический прием резкого упрощения и уменьшения пропорций персонажа (огромная голова и крошечное туловище). Используется как визуальный знак для мгновенного переключения сцены в комедийный, несерьезный или пародийный регистр.

- title: Ахогэ
  japanese: アホ毛 — «глупый волосок»
  category: Визуальные коды (Манпу)
  description: Отдельная непослушная прядь волос, торчащая на макушке персонажа и двигающаяся как антенна в такт его эмоциям. В визуальном языке аниме этот знак маркирует наивность, простодушие, энергичность или легкую чудаковатость героя.

- title: Кэмономими
  japanese: 獣耳 — «звериные ушки»
  category: Визуальные коды (Манпу)
  description: Дизайнерский троп наделения человекоподобных персонажей ушами и хвостами животных (кошек, лисиц, волков). Семиотически этот прием сочетает антропоморфную миловидность с отсылками к синтоистскому анимизму и тотемным духам («Волчица и пряности»).

- title: Сэмпай и кохай
  japanese: 先輩と後輩 — «старший и младший товарищ»
  category: Эстетика и философия
  description: Базовая модель конфуцианской иерархии в японском обществе, регулирующая отношения между более опытным наставником (сэмпай) и новичком (кохай) в школе, клубе или на работе. В аниме служит главным двигателем сюжетов о взрослении и передаче традиций.

- title: Махо-сёдзё
  japanese: 魔法少女 — «девочка-волшебница»
  category: Архетипы и тропы
  description: Культовый архетип и поджанр, в котором обычная школьница получает магический артефакт и способность трансформироваться для борьбы со злом. От классических сказок («Сейлор Мун») этот троп эволюционировал в глубокие психологические деконструкции («Девочка-волшебница Мадока»).
  
