<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }} — ISOF</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #F9F8F6;
            --bg-secondary: #FFFFFF;
            --bg-accent: #18181B;
            --text-main: #18181B;
            --text-muted: #52525B;
            --accent-red: #B91C1C;
            --border-color: #E4E4E7;
            --font-serif: 'Cormorant Garamond', Georgia, serif;
            --font-sans: 'Inter', -apple-system, sans-serif;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: var(--bg-primary); color: var(--text-main); font-family: var(--font-sans); line-height: 1.65; }
        a { color: inherit; text-decoration: none; }
        .container { max-width: 1100px; margin: 0 auto; padding: 0 20px; }
        
        /* Шапка */
        header { position: sticky; top: 0; background: rgba(249,248,246,0.95); backdrop-filter: blur(8px); border-bottom: 1px solid var(--border-color); z-index: 100; }
        .header-inner { display: flex; justify-content: space-between; align-items: center; min-height: 72px; padding: 12px 0; gap: 16px; }
        .logo { display: flex; align-items: center; gap: 12px; }
        .logo-badge { font-family: var(--font-serif); font-weight: 700; font-size: 26px; border: 2px solid var(--text-main); padding: 2px 9px; line-height: 1; }
        .logo-subtitle { font-size: 12px; line-height: 1.25; color: var(--text-muted); max-width: 165px; }
        
        nav ul { display: flex; list-style: none; gap: 24px; font-size: 14px; font-weight: 500; }
        nav a { transition: color 0.2s; }
        nav a:hover { color: var(--accent-red); }

        /* Стили для страницы статьи */
        .post-wrapper { max-width: 740px; margin: 56px auto; background: var(--bg-secondary); padding: 48px; border: 1px solid var(--border-color); border-radius: 4px; }
        .post-meta { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--accent-red); margin-bottom: 12px; }
        .post-title { font-family: var(--font-serif); font-size: 42px; line-height: 1.15; margin-bottom: 20px; }
        .post-lead { font-size: 18px; color: var(--text-muted); border-left: 3px solid var(--accent-red); padding-left: 16px; margin-bottom: 32px; }
        .post-cover { width: 100%; border-radius: 4px; margin-bottom: 32px; }
        .post-content h2 { font-family: var(--font-serif); font-size: 30px; margin: 36px 0 16px; }
        .post-content p { margin-bottom: 18px; font-size: 16px; }
        .post-content blockquote { background: var(--bg-primary); padding: 20px; border-left: 3px solid var(--text-main); margin: 24px 0; font-style: italic; }
        .post-content img { max-width: 100%; border-radius: 4px; margin: 20px 0; }

        /* Главная страница и сетка */
        .hero { padding: 56px 0; border-bottom: 1px solid var(--border-color); }
        .hero h1 { font-family: var(--font-serif); font-size: 46px; line-height: 1.12; margin: 12px 0 20px; max-width: 820px; }
        .articles-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; margin: 40px 0; }
        .article-card { background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: 4px; overflow: hidden; display: flex; flex-direction: column; }
        .article-card img { width: 100%; height: 180px; object-fit: cover; }
        .article-body { padding: 22px; flex-grow: 1; display: flex; flex-direction: column; }
        .article-card h3 { font-family: var(--font-serif); font-size: 24px; line-height: 1.25; margin: 8px 0 12px; }
        .article-card h3 a:hover { color: var(--accent-red); }
        .article-excerpt { font-size: 14px; color: var(--text-muted); margin-bottom: 16px; flex-grow: 1; }
        .article-tags { font-size: 12px; color: var(--text-muted); border-top: 1px solid var(--border-color); padding-top: 12px; }

        footer { border-top: 1px solid var(--border-color); padding: 40px 0; font-size: 13px; color: var(--text-muted); margin-top: 64px; }
        
        /* Адаптивность для смартфонов */
        @media (max-width: 800px) {
            .header-inner { flex-direction: column; align-items: flex-start; gap: 12px; }
            nav { width: 100%; border-top: 1px solid var(--border-color); padding-top: 10px; overflow-x: auto; }
            nav ul { gap: 18px; font-size: 13px; white-space: nowrap; }
            .articles-grid { grid-template-columns: 1fr; }
            .post-wrapper { padding: 24px; margin: 24px auto; }
            .post-title, .hero h1 { font-size: 32px; }
        }
    </style>
</head>
<body>
    <header>
        <div class="container header-inner">
            <a href="/" class="logo">
                <span class="logo-badge">ISOF</span>
                <span class="logo-subtitle">Институт семиотики образов и фольклора</span>
            </a>
            <nav>
                <ul>
                    <li><a href="/#articles">Исследования</a></li>
                    <li><a href="/#departments">Кафедры</a></li>
                    <li><a href="/glossary/">Глоссарий</a></li>
                    <li><a href="/#about">Об институте</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container">
        {{ content }}
    </main>

    <footer>
        <div class="container" style="display: flex; justify-content: space-between; flex-wrap: wrap; gap: 16px;">
            <span>© 2026 ISOF.RU — Институт семиотики образов и фольклора</span>
            <div style="display: flex; gap: 20px;">
                <a href="/#articles">Исследования</a>
                <a href="/glossary/">Глоссарий</a>
                <a href="/#about">О проекте</a>
            </div>
        </div>
    </footer>
</body>
</html>
